<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Outrich{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/outreach.css?v=20260926-a">
</head>
<body>
<div class="shell">
<aside>
  <a class="brand" href="/"><span>O</span> Outrich</a>
  <a class="workspace" href="/freight">Switch workspace &nbsp;<b>Freight</b></a>
  <nav class="nav">
    <a href="/" class="{{'active' if request.url.path == '/' else ''}}">Overview</a>
    <a href="/campaigns" class="{{'active' if request.url.path.startswith('/campaigns') else ''}}">Campaigns</a>
    <a href="/settings" class="{{'active' if request.url.path.startswith('/settings') else ''}}">Settings</a>
  </nav>
  <div class="aside-foot">
    {% if env.DRY_RUN %}<span class="dot"></span>Dry run - no live email{% else %}<span class="dot"></span>Live sending{% endif %}
    <form action="/logout" method="post"><button type="submit">Sign out</button></form>
  </div>
</aside>
<main>
{% if request.query_params.get('notice') %}<div class="notice">{{ request.query_params.get('notice') }}</div>{% endif %}
{% block main %}{% endblock %}
</main>
</div>
</body>
</html>
